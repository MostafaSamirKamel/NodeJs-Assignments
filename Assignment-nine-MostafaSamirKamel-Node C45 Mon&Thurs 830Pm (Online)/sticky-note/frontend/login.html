<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sticky Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="auth-container card p-4">
            <h2 class="text-center mb-4">Welcome Back</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <div class="d-grid shadow-sm">
                    <button type="submit" class="btn btn-success">Login</button>
                </div>
            </form>
            <p class="text-center mt-3">Don't have an account? <a href="signup.html">Register</a></p>
        </div>
    </div>
    <script src="main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const data = await apiRequest('/users/login', 'POST', { email, password });
            if (data && data.token) {
                localStorage.setItem('token', data.token);
                location.href = 'home.html';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - PostStream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <nav class="glass-nav">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <a href="index.html" class="text-decoration-none"><span class="brand-text">PostStream</span></a>
            <div id="navAction">
                <a href="login.html" class="btn btn-outline-secondary me-2 border-0">Login</a>
                <a href="signup.html" class="btn btn-premium" style="width: auto;">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div id="postsContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3 text-muted">Loading amazing stories...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Post Modal -->
    <div class="modal fade" id="createPostModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
                <div class="modal-body p-4">
                    <h3 class="mb-4">Create New Post</h3>
                    <form id="createPostForm">
                        <div class="input-group-custom">
                            <label>Title</label>
                            <input type="text" id="postTitle" required placeholder="What's on your mind?">
                        </div>
                        <div class="input-group-custom">
                            <label>Content</label>
                            <textarea id="postContent" rows="4" required placeholder="Tell your story..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-premium">Post It</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="floating-btn" id="addPostBtn" style="display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
